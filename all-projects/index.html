<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/all-pages.css">
    <link rel="stylesheet" href="../styles/all-projects.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <title>All Projects | P4ncake!</title>
</head>
<body>
    <div class="container">
        <div class="channels" id="channels">
            <div class="channel-container" id="channel-container">
                <div class="channel" style="--channel-image: url('../images/wii/channels/allure.webp');"><a href="../allure/"> </a></div>
                <div class="channel" style="--channel-image: url('../images/wii/channels/ncrs.webp'); --scan-lines: linear-gradient(#0000);"><a href="https://www.needcoolershoes.com/"> </a></div>
                <div class="channel" style="--channel-image: url('../images/wii/channels/portfolio.webp'); --scan-lines: linear-gradient(#0000);"><a href="../portfolio/#all-projects"> </a></div>
                <div class="channel" style="--channel-image: url('../images/wii/channels/portfolio.webp'); --scan-lines: linear-gradient(#0000);"><a href="../portfolio/#all-projects"> </a></div>
                <div class="channel" style="--channel-image: url('../images/wii/channels/portfolio.webp'); --scan-lines: linear-gradient(#0000);"><a href="../portfolio/#all-projects"> </a></div>
            </div>
        </div>
        <button class="nav-arrow left-arrow" id="left-arrow" onclick="scrollChannelsLeft()">&leftarrow;</button>
        <button class="nav-arrow right-arrow" id="right-arrow" onclick="scrollChannelsRight()">&rightarrow;</button>
        <div class="bottom-bar">
            <div class="hour-notch">
                <div class="notch-left"></div>
                <div class="notch-center"><div class="hour" id="hour">12:00㏂</div></div>
                <div class="notch-right"></div>
            </div>
            <div class="date" id="date">Wed 1/21</div>
            <div class="button-container left-button-container">
                <button onclick="window.location.href = './../#all-projects'" class="button-round button-left"><div class="icon p4ncake-icon" alt="🥞"></div></button>
            </div>
            <div class="button-container right-button-container">
                <button onclick="window.location.href = './'" class="button-round button-right"><div class="icon mail-icon" alt="✉️"></div></button>
            </div>
        </div>
    </div>

    <script src="../scripts/all-projects.js"></script>
</body>
</html>
